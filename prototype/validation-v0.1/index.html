<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kids Learning OS — Validation v0.1</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--ink:#1f2633;--muted:#657083;--accent:#5d67e8;--soft:#eef0ff;--good:#16794b;--warn:#925c00;--line:#e7e9f0;--shadow:0 14px 40px rgba(31,38,51,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select{font:inherit}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.shell{width:min(720px,100%)}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:800}.tag{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(22px,5vw,42px)}
    h1{font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0 0 14px} h2{font-size:clamp(23px,5vw,34px);margin:0 0 12px} p{line-height:1.6;margin:0 0 16px}.muted{color:var(--muted)}
    .grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:grid;gap:7px}.field label{font-weight:700;font-size:14px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 15px;background:#fff;color:var(--ink)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;cursor:pointer;min-height:52px}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:#3f49b9}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;font-size:19px;font-weight:800;text-align:center;cursor:pointer;min-height:64px}.choice:hover,.choice:focus{border-color:#aeb4ff;outline:none;background:#fafaff}
    .math{font-size:clamp(44px,12vw,76px);font-weight:900;text-align:center;margin:22px 0;letter-spacing:-2px}.answer-row{display:flex;gap:10px;justify-content:center}.answer-row input{width:160px;text-align:center;font-size:28px;font-weight:800;border:2px solid var(--line);border-radius:18px;padding:12px}
    .blocks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px auto}.block{width:34px;height:34px;border-radius:9px;background:#dfe2ff;border:2px solid #9ea6ff}.block.off{background:#f1f2f5;border-color:#d7d9df;opacity:.65;position:relative}.block.off:after{content:"";position:absolute;left:5px;right:5px;top:14px;height:3px;background:#b0b4bd;transform:rotate(-35deg);border-radius:3px}
    .step{background:#fafbff;border:1px solid #e3e6ff;border-radius:18px;padding:16px;margin:12px 0}.step strong{display:block;margin-bottom:5px}.progress{height:8px;background:#e9ebf3;border-radius:999px;overflow:hidden;margin-bottom:16px}.progress>div{height:100%;background:var(--accent);transition:width .25s ease}
    .notice{border-radius:18px;padding:14px 16px;margin:16px 0;background:#f4f7fb;color:#445064}.notice.good{background:#eaf8f0;color:var(--good)}.notice.warn{background:#fff6e3;color:var(--warn)}
    .report{display:grid;gap:12px}.report-row{border:1px solid var(--line);border-radius:18px;padding:16px}.report-row span{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}.report-row strong{font-size:17px}
    .tiny{font-size:12px;color:var(--muted);margin-top:18px}.center{text-align:center}.emoji{font-size:48px;margin-bottom:10px}.hidden{display:none!important}
    @media (max-width:560px){.two,.choices{grid-template-columns:1fr}.card{border-radius:22px}.actions .btn{width:100%}}
  </style>
</head>
<body>
<div class="app"><main class="shell">
  <div class="top"><div class="brand">Kids Learning OS</div><div class="tag">Validation v0.1 · local only</div></div>
  <section id="card" class="card"></section>
</main></div>
<script>
const card=document.getElementById('card');
const KEY='klo_validation_v01';
const state={grade:'1',lang:'en',screen:'setup',startAnswer:null,diagnosticAnswer:null,practiceAnswer:null,independentAnswer:null,path:null,hints:0,startedAt:null};
const saved=localStorage.getItem(KEY); if(saved){try{Object.assign(state,JSON.parse(saved))}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function reset(){localStorage.removeItem(KEY);Object.assign(state,{grade:'1',lang:'en',screen:'setup',startAnswer:null,diagnosticAnswer:null,practiceAnswer:null,independentAnswer:null,path:null,hints:0,startedAt:null});render()}
function progress(n){return `<div class="progress"><div style="width:${n}%"></div></div>`}
const copy={
 en:{split:'Let’s break 14 into 10 and 4.',first:'First, 10 − 8 = 2.',then:'Now add back the 4: 2 + 4 = 6.',count:'Let’s see the subtraction with objects. Fourteen blocks are here. We take away eight. Count what is left.',try:'Now you try one with the same idea.'},
 te:{split:'14 ni 10 + 4 ga split చేద్దాం.',first:'First, 10 − 8 = 2.',then:'ఇప్పుడు మిగిలిన 4 add చేద్దాం: 2 + 4 = 6.',count:'14 blocks ఉన్నాయి. 8 తీసేస్తాం. ఇప్పుడు ఎన్ని మిగిలాయో count చేద్దాం.',try:'ఇప్పుడు same idea తో నువ్వు try చెయ్యి.'},
 hi:{split:'14 ko 10 + 4 mein break karte hain.',first:'Pehle, 10 − 8 = 2.',then:'Ab bache hue 4 add karo: 2 + 4 = 6.',count:'Yahan 14 blocks hain. Hum 8 hataate hain. Ab jo bache hain unhe count karo.',try:'Ab isi idea se ek aur try karo.'}
};
function t(k){return copy[state.lang]?.[k]||copy.en[k]}
function go(screen){state.screen=screen;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function numericInput(id,label){return `<div class="answer-row"><input id="${id}" inputmode="numeric" pattern="[0-9]*" aria-label="${label}" autocomplete="off" /></div>`}
function getNum(id){const v=document.getElementById(id)?.value.trim();return v===''?null:Number(v)}
function blocks(total,removed){let out='';for(let i=0;i<total;i++)out+=`<span class="block ${i<removed?'off':''}"></span>`;return `<div class="blocks" aria-label="${total} blocks, ${removed} crossed out">${out}</div>`}
function setup(){card.innerHTML=`<div class="emoji">🌱</div><h1>Can we help without giving the answer away?</h1><p class="muted">A tiny prototype for Grades 1–2. It tests one subtraction learning loop. Nothing is uploaded.</p><div class="grid two" style="margin-top:22px"><div class="field"><label for="grade">Grade</label><select id="grade"><option value="1">Grade 1</option><option value="2">Grade 2</option></select></div><div class="field"><label for="lang">Explanation style</label><select id="lang"><option value="en">English</option><option value="te">Telugu + English</option><option value="hi">Hindi + English</option></select></div></div><div class="notice">Parent: please hand the phone to the child after tapping Start. Avoid helping unless the child wants to stop.</div><div class="actions"><button class="btn primary" id="start">Start child session</button></div><p class="tiny">Prototype only — not an assessment, diagnosis, or substitute for a teacher.</p>`;document.getElementById('grade').value=state.grade;document.getElementById('lang').value=state.lang;document.getElementById('start').onclick=()=>{state.grade=document.getElementById('grade').value;state.lang=document.getElementById('lang').value;state.startedAt=Date.now();go('warmup')}}
function warmup(){card.innerHTML=`${progress(8)}<div class="center"><div class="emoji">👋</div><h2>This part is for you.</h2><p>There are no marks here. If you’re not sure, you can say “I don’t know”.</p></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="go('q1')">I’m ready</button></div>`}
function q1(){card.innerHTML=`${progress(18)}<p class="muted center">Try it your way first.</p><div class="math">14 − 8 = ?</div>${numericInput('a1','Answer to fourteen minus eight')}<div class="actions" style="justify-content:center"><button class="btn primary" id="check">Check my thinking</button><button class="btn ghost" id="dontknow">I don’t know</button></div>`;document.getElementById('check').onclick=()=>{const n=getNum('a1');if(n===null)return;state.startAnswer=n;if(n===6){state.path='already-capable';go('method')}else{go('diag')}};document.getElementById('dontknow').onclick=()=>{state.startAnswer='not-sure';go('diag')}}
function method(){card.innerHTML=`${progress(32)}<div class="notice good"><strong>Nice — 6 is correct.</strong> I still want to understand how you thought about it.</div><h2>How did you solve 14 − 8?</h2><div class="choices"><button class="choice" onclick="state.path='decompose';go('practice')">I broke the number apart</button><button class="choice" onclick="state.path='count-back';go('practice')">I counted backwards</button><button class="choice" onclick="state.path='memory';go('practice')">I just knew it</button><button class="choice" onclick="state.path='unclear';go('practice')">I’m not sure</button></div>`}
function diag(){card.innerHTML=`${progress(30)}<p class="muted">That answer gives us a clue, but one question is never enough.</p><h2>Let’s try a smaller piece.</h2><div class="math">10 − 8 = ?</div>${numericInput('ad','Answer to ten minus eight')}<div class="actions" style="justify-content:center"><button class="btn primary" id="checkd">Continue</button><button class="btn ghost" id="hintd">Show me with blocks</button></div><div id="hint"></div>`;document.getElementById('checkd').onclick=()=>{const n=getNum('ad');if(n===null)return;state.diagnosticAnswer=n;if(n===2){state.path='bridge-through-ten';go('teachSplit')}else{state.path='concrete-subtraction';go('teachBlocks')}};document.getElementById('hintd').onclick=()=>{state.hints++;document.getElementById('hint').innerHTML=blocks(10,8)+`<p class="center muted">Eight are crossed out. Count the blocks that are left.</p>`;save()}}
function teachSplit(){card.innerHTML=`${progress(43)}<h2>Here’s another way to see it.</h2><div class="step"><strong>1</strong>${t('split')}</div><div class="step"><strong>2</strong>${t('first')}</div><div class="step"><strong>3</strong>${t('then')}</div><div class="notice good">So 14 − 8 = <strong>6</strong>.</div><p>${t('try')}</p><div class="actions"><button class="btn primary" onclick="go('practice')">Let me try</button></div>`}
function teachBlocks(){card.innerHTML=`${progress(43)}<h2>Let’s make it visible.</h2><p>${t('count')}</p>${blocks(14,8)}<div class="notice">There are <strong>6</strong> blocks left. So 14 − 8 = 6.</div><div class="step"><strong>Another shortcut</strong>${t('split')} ${t('first')} ${t('then')}</div><div class="actions"><button class="btn primary" onclick="go('practice')">I’ll try one</button></div>`}
function practice(){card.innerHTML=`${progress(58)}<p class="muted">Practice — help is available if you need it.</p><div class="math">13 − 7 = ?</div>${numericInput('ap','Answer to thirteen minus seven')}<div class="actions" style="justify-content:center"><button class="btn primary" id="checkp">Check</button><button class="btn ghost" id="hintp">Give me one hint</button></div><div id="phint"></div>`;document.getElementById('hintp').onclick=()=>{state.hints++;save();document.getElementById('phint').innerHTML=`<div class="notice">Hint: break 13 into <strong>10 + 3</strong>. What is 10 − 7?</div>`};document.getElementById('checkp').onclick=()=>{const n=getNum('ap');if(n===null)return;state.practiceAnswer=n;if(n===6){go('independent')}else{state.hints++;save();document.getElementById('phint').innerHTML=`<div class="notice warn">Not quite yet. Try: 10 − 7 = 3, then 3 + 3 = ?</div>`}}
function independent(){card.innerHTML=`${progress(76)}<p class="muted center">Last one. No hints this time.</p><h2 class="center">Try it completely by yourself.</h2><div class="math">15 − 8 = ?</div>${numericInput('ai','Answer to fifteen minus eight')}<div class="actions" style="justify-content:center"><button class="btn primary" id="checki">Finish</button></div>`;document.getElementById('checki').onclick=()=>{const n=getNum('ai');if(n===null)return;state.independentAnswer=n;go('childDone')}}
function childDone(){const ok=state.independentAnswer===7;card.innerHTML=`${progress(92)}<div class="center"><div class="emoji">${ok?'🌟':'🌱'}</div><h2>${ok?'You did that one on your own.':'Good work staying with it.'}</h2><p>${ok?'That is the part we care about most — doing a new problem without help.':'Learning can take more than one try. We’ll show the parent what happened without calling it a failure.'}</p></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="go('report')">Give the phone to a parent</button></div>`}
function report(){const independent=state.independentAnswer===7;const startCorrect=state.startAnswer===6;const elapsed=state.startedAt?Math.max(1,Math.round((Date.now()-state.startedAt)/60000)):null;let signal='The child may benefit from more practice with subtracting across 10.';if(independent&&!startCorrect)signal='The child improved within this short session and completed a new subtraction problem independently.';if(independent&&startCorrect)signal='The child showed independent capability on both the opening and transfer problems.';card.innerHTML=`${progress(100)}<div class="emoji">📌</div><h2>Parent summary</h2><p class="muted">This describes what happened in this session. It is not a diagnosis.</p><div class="report"><div class="report-row"><span>Opening problem · 14 − 8</span><strong>${state.startAnswer==='not-sure'?'Not sure':state.startAnswer}</strong></div><div class="report-row"><span>Learning path used</span><strong>${labelPath(state.path)}</strong></div><div class="report-row"><span>Hints / extra support</span><strong>${state.hints}</strong></div><div class="report-row"><span>Independent check · 15 − 8</span><strong>${state.independentAnswer} ${independent?'✓':''}</strong></div><div class="report-row"><span>Current signal</span><strong>${signal}</strong></div>${elapsed?`<div class="report-row"><span>Approx. session time</span><strong>${elapsed} min</strong></div>`:''}</div><div class="notice">A real product would revisit the idea later to check retention. One successful session is not enough to claim mastery.</div><div class="actions"><button class="btn primary" id="copy">Copy summary</button><button class="btn ghost" onclick="reset()">Start fresh</button></div><p class="tiny">All prototype state stays in this browser only.</p>`;document.getElementById('copy').onclick=async()=>{const txt=`Kids Learning OS validation\nGrade ${state.grade}\nOpening 14-8: ${state.startAnswer}\nPath: ${labelPath(state.path)}\nHints: ${state.hints}\nIndependent 15-8: ${state.independentAnswer}\nSignal: ${signal}`;try{await navigator.clipboard.writeText(txt);document.getElementById('copy').textContent='Copied ✓'}catch(e){alert(txt)}}}
function labelPath(p){return ({'already-capable':'Already capable','decompose':'Break-apart strategy','count-back':'Count-back strategy','memory':'Recall / mental strategy','unclear':'Strategy unclear','bridge-through-ten':'Bridge through 10','concrete-subtraction':'Concrete blocks + bridge through 10'})[p]||'Not recorded'}
function render(){({setup,warmup,q1,method,diag,teachSplit,teachBlocks,practice,independent,childDone,report}[state.screen]||setup)()}
render();
</script>
</body>
</html>
