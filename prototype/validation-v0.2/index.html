<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kids Learning OS — Validation v0.2.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7fb;color:#202534}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(700px,100%);background:#fff;border:1px solid #e6e8f0;border-radius:26px;padding:clamp(22px,5vw,40px);box-shadow:0 18px 50px rgba(31,38,51,.08)}h1,h2{line-height:1.1}h1{font-size:clamp(29px,6vw,43px);margin:0 0 14px}h2{font-size:clamp(24px,5vw,34px)}p{line-height:1.55}.muted{color:#677083}.top{font-size:13px;color:#677083;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}.pill{border:1px solid #e6e8f0;border-radius:999px;padding:5px 9px;background:#fff}.field{display:grid;gap:7px;margin:15px 0}.field select,.answer{border:1px solid #dfe2eb;border-radius:15px;padding:14px;background:#fff;color:#202534}.answer{font-size:28px;width:160px;text-align:center;font-weight:800}.math{text-align:center;font-weight:900;font-size:clamp(48px,13vw,76px);margin:24px 0}.center{text-align:center}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:16px;padding:15px 18px;font:inherit;font-weight:800;cursor:pointer;background:#5965e8;color:#fff;min-height:52px}.secondary{background:#eef0ff;color:#3d47ad}.ghost{background:#fff;color:#202534;border:1px solid #e6e8f0}.actions .btn{flex:1}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:1px solid #e6e8f0;border-radius:16px;background:#fff;padding:16px;font:inherit;font-weight:750;cursor:pointer;text-align:left}.note{padding:14px 16px;border-radius:16px;background:#f3f5fa;margin:16px 0}.good{background:#eaf8ef;color:#176b45}.warn{background:#fff5de;color:#8a5900}.step{background:#fafbff;border:1px solid #e4e7ff;border-radius:17px;padding:15px;margin:10px 0}.blocks{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:22px 0}.b{width:31px;height:31px;border-radius:8px;background:#dfe2ff;border:2px solid #9da5ff}.off{opacity:.28}.report{display:grid;gap:10px}.report>div{border:1px solid #e6e8f0;border-radius:16px;padding:14px}.report span{display:block;color:#677083;font-size:12px;margin-bottom:4px}.tiny{font-size:12px;color:#677083;margin-top:18px}progress{width:100%;height:8px}@media(max-width:540px){.choices{grid-template-columns:1fr}.actions{display:grid}.card{border-radius:20px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap"><main class="card" id="app"><p>Loading validation prototype…</p></main></div>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const state = {grade:'1',lang:'en',stage:'setup',start:null,diag:null,practice:null,final:null,hints:0,path:'grade-level practice',strategy:'not recorded',questionStartedAt:null,firstQuestionSeconds:null,diagHint:0,practiceHint:0};
  const copy={en:{split:'Break the number into easier parts.'},te:{split:'Number ni easy parts ga split చేద్దాం.'},hi:{split:'Number ko easy parts mein break karte hain.'}};
  const t=(key)=>copy[state.lang]?.[key]||copy.en[key];
  const grade1=()=>state.grade==='1';
  const qStart=()=>grade1()?'8 − 3':'34 − 8';
  const aStart=()=>grade1()?5:26;
  const qPractice=()=>grade1()?'9 − 4':'43 − 7';
  const aPractice=()=>grade1()?5:36;
  const qFinal=()=>grade1()?'7 − 3':'52 − 8';
  const aFinal=()=>grade1()?4:44;
  const top=(p)=>`<div class="top"><span>Kids Learning OS · Validation v0.2.1</span><span class="pill">Grade ${state.grade}</span></div><progress value="${p}" max="7"></progress>`;
  const input=(id)=>`<div class="center"><input class="answer" id="${id}" inputmode="numeric" autocomplete="off" aria-label="Answer" /></div>`;
  const blocks=(n,r)=>`<div class="blocks" aria-label="${n} blocks, ${r} removed">${Array.from({length:n},(_,i)=>`<i class="b ${i<r?'off':''}"></i>`).join('')}</div>`;
  const readNumber=(id)=>{const el=document.getElementById(id);if(!el||el.value.trim()==='')return null;const n=Number(el.value);return Number.isFinite(n)?n:null;};
  const btn=(label,action,cls='btn')=>`<button class="${cls}" data-action="${action}">${label}</button>`;
  function practiceHintHtml(){if(state.practiceHint===0)return '';if(grade1()) return state.practiceHint===1?'<div class="note">Start at 9 and take away 4 slowly. Fingers are okay.</div>':blocks(9,4)+'<p class="center muted">Count what remains.</p>';return state.practiceHint===1?'<div class="note">43 − 7 crosses a ten. First reach 40.</div>':'<div class="note">Take away 3 to reach 40. Then take away 4 more. 40 − 4 = ?</div>';}
  function render(){switch(state.stage){
    case 'setup':app.innerHTML=`<div class="top"><span>Kids Learning OS · Validation v0.2.1</span><span class="pill">local only</span></div><h1>Start at the grade. Follow the child.</h1><p class="muted">Grade 1 and Grade 2 start differently. The flow can step backward if a prerequisite is missing.</p><div class="field"><b>Grade</b><select id="gradeSelect"><option value="1">Grade 1</option><option value="2">Grade 2</option></select></div><div class="field"><b>Explanation style</b><select id="langSelect"><option value="en">English</option><option value="te">Telugu + English</option><option value="hi">Hindi + English</option></select></div><div class="note">Parent: finger counting, taking time, drawing, or mental calculation are all useful observations.</div><div class="actions">${btn('Start child session','start')}</div><p class="tiny">No account, child name, camera, microphone, analytics, or upload.</p>`;document.getElementById('gradeSelect').value=state.grade;document.getElementById('langSelect').value=state.lang;break;
    case 'warm':app.innerHTML=`${top(1)}<div class="center"><h2>👋 This part is for you.</h2><p>You can use your fingers, count slowly, think in your head, or say “I don’t know”.</p>${btn('I’m ready','ready')}</div>`;break;
    case 'q1':app.innerHTML=`${top(2)}<p class="muted center">Try it your way first.</p><div class="math">${qStart()} = ?</div>${input('startAnswer')}<div class="actions">${btn('Continue','submit-start')}${btn('I don’t know','dont-know','btn ghost')}</div>`;break;
    case 'strategy':app.innerHTML=`${top(3)}<h2>How did you try that?</h2><div class="choices"><button class="choice" data-strategy="fingers">✋ I used my fingers</button><button class="choice" data-strategy="counting">🔢 I counted in my head</button><button class="choice" data-strategy="split">🧩 I broke the number apart</button><button class="choice" data-strategy="remembered">⚡ I remembered / just knew</button><button class="choice" data-strategy="drawing">✏️ I drew or imagined objects</button><button class="choice" data-strategy="not sure">🌱 I’m not sure</button></div>`;break;
    case 'diag1':app.innerHTML=`${top(4)}<p class="muted">Let’s make the problem smaller.</p><div class="math">5 − 2 = ?</div>${input('diagAnswer')}<div class="actions">${btn('Continue','submit-diag')}${btn('Hint 1','diag-hint-1','btn secondary')}${btn('Hint 2','diag-hint-2','btn secondary')}</div>${state.diagHint===1?'<div class="note">Hold up 5 fingers. Put 2 down. How many are still up?</div>':state.diagHint===2?blocks(5,2)+'<p class="center muted">Count what is left.</p>':''}`;break;
    case 'diag2':app.innerHTML=`${top(4)}<p class="muted">Let’s check the smaller prerequisite.</p><div class="math">14 − 8 = ?</div>${input('diagAnswer')}<div class="actions">${btn('Continue','submit-diag')}${btn('Hint 1','diag-hint-1','btn secondary')}${btn('Hint 2','diag-hint-2','btn secondary')}</div>${state.diagHint===1?'<div class="note">Split 14 into 10 + 4. What is 10 − 8?</div>':state.diagHint===2?blocks(14,8)+'<p class="center muted">Count what is left.</p>':''}`;break;
    case 'teach1':app.innerHTML=`${top(5)}<h2>Let’s make subtraction visible.</h2>${blocks(8,3)}<div class="note">Start with 8 objects. Take away 3. Count what remains: <b>5</b>.</div><div class="step">Using fingers or objects is allowed. Later the child may need them less.</div>${btn('Try another','to-practice')}`;break;
    case 'teach2':app.innerHTML=`${top(5)}<h2>Now rebuild the Grade 2 problem.</h2><div class="step"><b>1.</b> 34 can be seen as 20 + 14.</div><div class="step"><b>2.</b> 14 − 8 = 6.</div><div class="step"><b>3.</b> 20 + 6 = <b>26</b>.</div><div class="note good">So 34 − 8 = 26. ${t('split')}</div>${btn('Try another','to-practice')}`;break;
    case 'teach2c':app.innerHTML=`${top(5)}<h2>We stepped back one level.</h2>${blocks(14,8)}<div class="note">First make sure 14 − 8 = <b>6</b> is understood.</div><div class="step">Then return to 34 − 8: keep 20 aside, solve 14 − 8, then put 20 back → <b>26</b>.</div>${btn('Try another','to-practice')}`;break;
    case 'practice':app.innerHTML=`${top(6)}<p class="muted">Practice — two levels of help are available.</p><div class="math">${qPractice()} = ?</div>${input('practiceAnswer')}<div class="actions">${btn('Check','submit-practice')}${btn('Hint 1','practice-hint-1','btn secondary')}${btn('Hint 2','practice-hint-2','btn secondary')}</div>${practiceHintHtml()}`;break;
    case 'final':app.innerHTML=`${top(7)}<p class="muted center">Last one. No hints this time.</p><h2 class="center">Try it completely by yourself.</h2><div class="math">${qFinal()} = ?</div>${input('finalAnswer')}<div class="actions">${btn('Finish','submit-final')}</div>`;break;
    case 'done':{const ok=state.final===aFinal();app.innerHTML=`<div class="center"><h2>${ok?'🌟 You did that one on your own.':'🌱 Good work staying with it.'}</h2><p>${ok?'Independent performance is the strongest signal from this short session.':'This may mean another representation or more practice is useful. It is not failure.'}</p>${btn('Give phone back to parent','report')}</div>`;break;}
    case 'report':{const ok=state.final===aFinal();app.innerHTML=`<div class="top"><span>Parent summary</span><span class="pill">Grade ${state.grade}</span></div><h2>What happened?</h2><div class="report"><div><span>Starting problem</span><b>${qStart()} → ${state.start}</b></div><div><span>Child-reported strategy</span><b>${state.strategy}</b></div><div><span>Time on first problem</span><b>${state.firstQuestionSeconds ?? '—'} seconds</b></div><div><span>Teaching path</span><b>${state.path}</b></div><div><span>Hints used</span><b>${state.hints}</b></div><div><span>Independent transfer</span><b>${qFinal()} → ${state.final} · ${ok?'independent success':'needs another session'}</b></div></div><div class="note">Finger counting, drawing, or taking extra time can be useful strategies. This records what happened; it does not diagnose the child.</div><div class="actions">${btn('Start a new session','restart','btn ghost')}</div>`;break;}
  }}
  function go(stage){state.stage=stage;render();window.scrollTo({top:0,behavior:'smooth'});}
  function recordFirstTime(){if(state.firstQuestionSeconds===null&&state.questionStartedAt){state.firstQuestionSeconds=Math.max(0,Math.round((Date.now()-state.questionStartedAt)/1000));}}
  app.addEventListener('click',(event)=>{const strategyButton=event.target.closest('[data-strategy]');if(strategyButton){state.strategy=strategyButton.dataset.strategy;go(state.start===aStart()?'practice':grade1()?'diag1':'diag2');return;}const button=event.target.closest('button[data-action]');if(!button)return;const action=button.dataset.action;
    if(action==='start'){state.grade=document.getElementById('gradeSelect').value;state.lang=document.getElementById('langSelect').value;go('warm');return;}
    if(action==='ready'){state.questionStartedAt=Date.now();go('q1');return;}
    if(action==='submit-start'){const v=readNumber('startAnswer');if(v===null)return;state.start=v;recordFirstTime();go('strategy');return;}
    if(action==='dont-know'){state.start='not sure';recordFirstTime();go('strategy');return;}
    if(action==='diag-hint-1'){state.hints++;state.diagHint=1;render();return;}
    if(action==='diag-hint-2'){state.hints++;state.diagHint=2;render();return;}
    if(action==='submit-diag'){const v=readNumber('diagAnswer');if(v===null)return;state.diag=v;if(grade1()){state.path=v===3?'concrete-to-symbolic':'needs-concrete-foundation';go('teach1');}else if(v===6){state.path='bridge-through-ten';go('teach2');}else{state.path='stepped-back-to-concrete';go('teach2c');}return;}
    if(action==='to-practice'){state.practiceHint=0;go('practice');return;}
    if(action==='practice-hint-1'){state.hints++;state.practiceHint=1;render();return;}
    if(action==='practice-hint-2'){state.hints++;state.practiceHint=2;render();return;}
    if(action==='submit-practice'){const v=readNumber('practiceAnswer');if(v===null)return;state.practice=v;if(v===aPractice())go('final');else{state.practiceHint=Math.max(1,state.practiceHint);render();const field=document.getElementById('practiceAnswer');if(field){field.value=String(v);field.focus();}}return;}
    if(action==='submit-final'){const v=readNumber('finalAnswer');if(v===null)return;state.final=v;go('done');return;}
    if(action==='report'){go('report');return;}
    if(action==='restart'){Object.assign(state,{grade:'1',lang:'en',stage:'setup',start:null,diag:null,practice:null,final:null,hints:0,path:'grade-level practice',strategy:'not recorded',questionStartedAt:null,firstQuestionSeconds:null,diagHint:0,practiceHint:0});render();return;}
  });
  render();
})();
</script>
</body>
</html>
