<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kids Learning OS — Validation v0.2</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#202534;--muted:#677083;--line:#e6e8f0;--accent:#5965e8;--soft:#eef0ff;--good:#176b45;--warn:#8a5900;--shadow:0 18px 50px rgba(31,38,51,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(700px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(22px,5vw,40px);box-shadow:var(--shadow)}h1,h2{line-height:1.1}h1{font-size:clamp(29px,6vw,43px);margin:0 0 14px}h2{font-size:clamp(24px,5vw,34px)}p{line-height:1.55}.muted{color:var(--muted)}.top{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff}.field{display:grid;gap:7px;margin:15px 0}.field select,.answer{border:1px solid #dfe2eb;border-radius:15px;padding:14px;background:#fff;color:var(--ink)}.answer{font-size:28px;width:160px;text-align:center;font-weight:800}.math{text-align:center;font-weight:900;font-size:clamp(48px,13vw,76px);margin:24px 0}.center{text-align:center}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;min-height:52px}.btn.secondary{background:var(--soft);color:#3d47ad}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.actions .btn{flex:1}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px;font-weight:750;cursor:pointer;text-align:left}.note{padding:14px 16px;border-radius:16px;background:#f3f5fa;margin:16px 0}.note.good{background:#eaf8ef;color:var(--good)}.note.warn{background:#fff5de;color:var(--warn)}.step{background:#fafbff;border:1px solid #e4e7ff;border-radius:17px;padding:15px;margin:10px 0}.blocks{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:22px 0}.b{width:31px;height:31px;border-radius:8px;background:#dfe2ff;border:2px solid #9da5ff}.b.off{opacity:.28;position:relative}.b.off:after{content:"";position:absolute;left:5px;right:5px;top:13px;height:3px;background:#767b8b;transform:rotate(-35deg)}.tens{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}.ten{width:24px;height:92px;border-radius:7px;background:#dfe2ff;border:2px solid #9da5ff}.one{width:24px;height:24px;border-radius:6px;background:#e9ebff;border:2px solid #aeb4ff}.report{display:grid;gap:10px}.report>div{border:1px solid var(--line);border-radius:16px;padding:14px}.report span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.tiny{font-size:12px;color:var(--muted);margin-top:18px}progress{width:100%;height:8px}.strategy{font-weight:800}.subtle{font-size:14px;color:var(--muted)}
@media(max-width:540px){.choices{grid-template-columns:1fr}.actions{display:grid}.card{border-radius:20px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap"><main class="card" id="app"></main></div>
<script>
const app=document.getElementById('app');
const KEY='klo_validation_v02';
const initial={grade:'1',lang:'en',start:null,diag:null,practice:null,final:null,hints:0,path:'',strategy:'not recorded',startedAt:null,questionStartedAt:null,firstQuestionSeconds:null};
const s={...initial};
try{Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(s));
const reset=()=>{localStorage.removeItem(KEY);Object.assign(s,initial);setup()};
const tx={
 en:{split:'Break the number into easier parts.',take:'Take away the easier part first.',join:'Put the parts back together.'},
 te:{split:'Number ni easy parts ga split చేద్దాం.',take:'ముందు easy part తీసేద్దాం.',join:'తర్వాత parts ని మళ్లీ కలుపుదాం.'},
 hi:{split:'Number ko easy parts mein break karte hain.',take:'Pehle easy part minus karo.',join:'Phir parts ko wapas jodo.'}
};
const t=k=>tx[s.lang]?.[k]||tx.en[k];
function page(html){app.innerHTML=html;save();window.scrollTo({top:0,behavior:'smooth'})}
function input(id,label){return `<div class="center"><input class="answer" id="${id}" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="${label}"></div>`}
function num(id){const el=document.getElementById(id);if(!el||el.value.trim()==='')return null;return Number(el.value)}
function blocks(total,removed){return '<div class="blocks">'+Array.from({length:total},(_,i)=>`<i class="b ${i<removed?'off':''}"></i>`).join('')+'</div>'}
function placeValue(tens,ones){return '<div class="tens">'+Array.from({length:tens},()=>'<i class="ten"></i>').join('')+Array.from({length:ones},()=>'<i class="one"></i>').join('')+'</div>'}
function top(progress){return `<div class="top"><span>Kids Learning OS · Validation v0.2</span><span class="pill">Grade ${s.grade}</span></div><progress value="${progress}" max="7"></progress>`}
function setup(){page(`<div class="top"><span>Kids Learning OS · Validation v0.2</span><span class="pill">local only</span></div><h1>Start at the grade. Follow the child.</h1><p class="muted">This version uses different Grade 1 and Grade 2 maths paths, then steps backward or forward based on what the child can actually do.</p><div class="field"><b>Grade</b><select id="g"><option value="1">Grade 1</option><option value="2">Grade 2</option></select></div><div class="field"><b>Explanation style</b><select id="l"><option value="en">English</option><option value="te">Telugu + English</option><option value="hi">Hindi + English</option></select></div><div class="note">Parent: tap Start, then hand the phone to the child. Finger counting, taking time, drawing, or mental calculation are all useful observations — please do not stop them.</div><div class="actions"><button class="btn" id="go">Start child session</button></div><p class="tiny">No account, child name, camera, microphone, analytics, or upload. This is not a diagnosis or school assessment.</p>`);g.value=s.grade;l.value=s.lang;go.onclick=()=>{s.grade=g.value;s.lang=l.value;s.startedAt=Date.now();s.questionStartedAt=Date.now();save();warm()}}
function warm(){page(`${top(1)}<div class="center"><h2>👋 This part is for you.</h2><p>There are no marks here. You can use your fingers, count slowly, think in your head, or say “I don’t know”.</p><button class="btn" onclick="q1()">I’m ready</button></div>`)}
function q1(){s.questionStartedAt=Date.now();const q=s.grade==='1'?'8 − 3':'34 − 8';page(`${top(2)}<p class="muted center">Try it your way first.</p><div class="math">${q} = ?</div>${input('x','Answer')}<div class="actions"><button class="btn" id="check">Continue</button><button class="btn ghost" id="dk">I don’t know</button></div>`);check.onclick=()=>{const v=num('x');if(v===null)return;s.start=v;s.firstQuestionSeconds=Math.round((Date.now()-s.questionStartedAt)/1000);strategy()};dk.onclick=()=>{s.start='not sure';s.firstQuestionSeconds=Math.round((Date.now()-s.questionStartedAt)/1000);strategy()}}
function strategy(){page(`${top(3)}<h2>How did you try that?</h2><p class="muted">There is no best choice here. We just want to understand your current strategy.</p><div class="choices"><button class="choice" data-v="fingers">✋ I used my fingers</button><button class="choice" data-v="counting">🔢 I counted in my head</button><button class="choice" data-v="split">🧩 I broke the number apart</button><button class="choice" data-v="remembered">⚡ I remembered / just knew</button><button class="choice" data-v="drawing">✏️ I drew or imagined objects</button><button class="choice" data-v="not sure">🌱 I’m not sure</button></div>`);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{s.strategy=b.dataset.v;save();afterStrategy()})}
function afterStrategy(){const correct=s.grade==='1'?s.start===5:s.start===26;if(correct){s.path='grade-start-capable';practice()}else{diag()}}
function diag(){if(s.grade==='1')diag1();else diag2()}
function diag1(){page(`${top(4)}<p class="muted">Let’s make the problem smaller.</p><div class="math">5 − 2 = ?</div>${input('d','Answer')}<div class="actions"><button class="btn" id="dc">Continue</button><button class="btn secondary" id="h1">Hint 1</button><button class="btn secondary" id="h2">Hint 2</button></div><div id="hint"></div>`);h1.onclick=()=>{s.hints++;save();hint.innerHTML='<div class="note">Hold up 5 fingers. Put 2 down. How many are still up?</div>'};h2.onclick=()=>{s.hints++;save();hint.innerHTML=blocks(5,2)+'<p class="center muted">Two are crossed out. Count what is left.</p>'};dc.onclick=()=>{const v=num('d');if(v===null)return;s.diag=v;s.path=v===3?'concrete-to-symbolic':'needs-concrete-foundation';teach1(v===3)}}
function teach1(ready){page(`${top(5)}<h2>${ready?'Good — now connect it to the first problem.':'Let’s make subtraction visible.'}</h2>${blocks(8,3)}<div class="note">Start with 8 objects. Take away 3. Count what remains: <b>5</b>.</div><div class="step"><b>What matters:</b> using fingers or objects is allowed. Later, as this becomes easier, the child may need them less.</div><button class="btn" onclick="practice()">Try another</button>`)}
function diag2(){page(`${top(4)}<p class="muted">Let’s check the smaller prerequisite inside that problem.</p><div class="math">14 − 8 = ?</div>${input('d','Answer')}<div class="actions"><button class="btn" id="dc">Continue</button><button class="btn secondary" id="h1">Hint 1</button><button class="btn secondary" id="h2">Hint 2</button></div><div id="hint"></div>`);h1.onclick=()=>{s.hints++;save();hint.innerHTML='<div class="note">Try splitting 14 into 10 + 4. What is 10 − 8?</div>'};h2.onclick=()=>{s.hints++;save();hint.innerHTML=blocks(14,8)+'<p class="center muted">Eight are crossed out. Count what is left.</p>'};dc.onclick=()=>{const v=num('d');if(v===null)return;s.diag=v;if(v===6){s.path='bridge-through-ten';teach2()}else{s.path='stepped-back-to-concrete';teach2Concrete()}}}
function teach2(){page(`${top(5)}<h2>Now rebuild the Grade 2 problem.</h2>${placeValue(3,4)}<div class="step"><b>1.</b> 34 can be seen as 20 + 14.</div><div class="step"><b>2.</b> 14 − 8 = 6.</div><div class="step"><b>3.</b> 20 + 6 = <b>26</b>.</div><div class="note good">So 34 − 8 = 26. ${t('split')}</div><button class="btn" onclick="practice()">Try another</button>`)}
function teach2Concrete(){page(`${top(5)}<h2>We stepped back one level.</h2>${blocks(14,8)}<div class="note">First make sure 14 − 8 = <b>6</b> is understood.</div><div class="step">Then connect it to 34 − 8: keep 20 aside, solve 14 − 8, then put the 20 back. That gives <b>26</b>.</div><button class="btn" onclick="practice()">Try another</button>`)}
function practice(){const q=s.grade==='1'?'9 − 4':'43 − 7';const ans=s.grade==='1'?5:36;page(`${top(6)}<p class="muted">Practice — there are two levels of help if you need them.</p><div class="math">${q} = ?</div>${input('p','Practice answer')}<div class="actions"><button class="btn" id="pc">Check</button><button class="btn secondary" id="p1">Hint 1</button><button class="btn secondary" id="p2">Hint 2</button></div><div id="pv"></div>`);p1.onclick=()=>{s.hints++;save();pv.innerHTML=s.grade==='1'?'<div class="note">Start at 9 and take away 4 slowly. Fingers are okay.</div>':'<div class="note">43 − 7 crosses a ten. Think: how much do you take from 43 to reach 40 first?</div>'};p2.onclick=()=>{s.hints++;save();pv.innerHTML=s.grade==='1'?blocks(9,4)+'<p class="center muted">Count what remains.</p>':'<div class="note">Take away 3 to reach 40. You still need to take away 4 more. 40 − 4 = ?</div>'};pc.onclick=()=>{const v=num('p');if(v===null)return;s.practice=v;if(v===ans)finalQ();else{pv.innerHTML='<div class="note warn">Not yet. Use a hint, take your time, then try again.</div>'}}}
function finalQ(){const q=s.grade==='1'?'7 − 3':'52 − 8';page(`${top(7)}<p class="muted center">Last one. No hints this time.</p><h2 class="center">Try it completely by yourself.</h2><div class="math">${q} = ?</div>${input('f','Independent answer')}<div class="actions"><button class="btn" id="fc">Finish</button></div>`);fc.onclick=()=>{const v=num('f');if(v===null)return;s.final=v;done()}}
function done(){const ans=s.grade==='1'?4:44;const ok=s.final===ans;page(`<div class="center"><h2>${ok?'🌟 You did that one on your own.':'🌱 Good work staying with it.'}</h2><p>${ok?'Independent performance is the strongest signal from this short session.':'This only means the child may need another representation or more practice. It is not failure.'}</p><button class="btn" onclick="report()">Give phone back to parent</button></div>`)}
function report(){const finalQ=s.grade==='1'?'7 − 3':'52 − 8';const ans=s.grade==='1'?4:44;const ok=s.final===ans;const startQ=s.grade==='1'?'8 − 3':'34 − 8';page(`<div class="top"><span>Parent summary</span><span class="pill">Grade ${s.grade}</span></div><h2>What happened in this short session?</h2><div class="report"><div><span>Starting problem</span><b>${startQ} → ${s.start}</b></div><div><span>Child-reported strategy</span><b class="strategy">${s.strategy}</b></div><div><span>Time on first problem</span><b>${s.firstQuestionSeconds??'—'} seconds</b><small class="subtle"> Time is context, not a score.</small></div><div><span>Teaching path</span><b>${s.path||'grade-level practice'}</b></div><div><span>Hints used</span><b>${s.hints}</b></div><div><span>Independent transfer check</span><b>${finalQ} → ${s.final} · ${ok?'independent success':'needs another session'}</b></div></div><div class="note">Finger counting, drawing, or taking extra time can be developmentally useful strategies. This summary records what happened; it does not diagnose the child.</div><div class="actions"><button class="btn ghost" onclick="reset()">Start a new session</button></div><p class="tiny">Observer: separately note whether the child understood the hints, needed adult intervention, became frustrated, or changed strategy.</p>`)}
setup();
</script>
</body>
</html>
